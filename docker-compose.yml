version: '3.8'

services:
  blockchain:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./blockchain:/app
    command: sh -c "npm install && npx hardhat node"
    ports:
      - "8545:8545"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=super_secret_jwt_key_chainkyc_docker_safe
      - FRONTEND_URL=http://localhost:5173
      - RPC_URL=http://blockchain:8545
      - UPLOAD_DIR=storage/uploads
    ports:
      - "5000:5000"
    volumes:
      - ./backend/prisma/dev.db:/app/prisma/dev.db
      - ./backend/storage/uploads:/app/storage/uploads
    depends_on:
      - blockchain

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_CHAIN_ID=31337
    depends_on:
      - backend
